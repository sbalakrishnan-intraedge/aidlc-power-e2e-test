openapi: 3.0.3\ninfo:\n  title: AIDLC Power E2E Test API\n  description: API documentation for the end-to-end test service\n  version: 1.0.0\npaths:\n  /api/auth/login:\n    post:\n      summary: User login\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                email:\n                  type: string\n                  format: email\n                password:\n                  type: string\n      responses:\n        '200':\n          description: Login successful\n        '400':\n          description: Invalid input\n        '401':\n          description: Authentication failed\n  /api/users/register:\n    post:\n      summary: Register new user\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: object\n              properties:\n                email:\n                  type: string\n                  format: email\n                password:\n                  type: string\n                  minLength: 8\n                name:\n                  type: string\n      responses:\n        '201':\n          description: User created successfully\n        '400':\n          description: Validation error\n        '409':\n          description: Email already exists\n